name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Auditar mídias e artefatos publicados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências Python fixadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-media.txt

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar navegadores
        run: |
          python -m playwright install --with-deps chromium webkit
          python -m playwright install chrome

      - name: Testes do pipeline de mídias
        timeout-minutes: 30
        run: python -m unittest discover -s tests -p 'test_media.py'

      - name: Auditar apresentacao/docs
        timeout-minutes: 45
        env:
          MEDIA_CHECK_CHROMIUM_CHANNEL: chrome
          MEDIA_CHECK_PASS_DEADLINE: '420'
        run: |
          python scripts/check_media.py --root apresentacao/docs \
            --source apresentacao --report reports/check-render.json \
            --require-receipt

      - name: Auditar docs
        timeout-minutes: 45
        env:
          MEDIA_CHECK_CHROMIUM_CHANNEL: chrome
          MEDIA_CHECK_PASS_DEADLINE: '420'
        run: |
          python scripts/check_media.py --root docs \
            --source apresentacao --report reports/check-pages.json \
            --require-receipt

      - name: Comparar as duas árvores publicadas
        run: diff -rq apresentacao/docs docs

      - name: Anexar relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-auditoria
          path: reports
          if-no-files-found: ignore

      - name: Configurar Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Enviar artefato auditado
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publicar artefato auditado
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
